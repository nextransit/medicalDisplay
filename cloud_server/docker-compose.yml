version: '3.8'

services:
  # ================================================================
  # FastAPI Cloud Server
  # ================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical_display_api
    ports:
      - "8000:8000"
      - "8443:8443"  # HTTPS
    environment:
      - DATABASE_URL=sqlite:///./medical_display.db
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
      - SECRET_KEY=${SECRET_KEY:-changeme}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - mosquitto
      - redis
    networks:
      - medical_display_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ================================================================
  # MQTT Broker (Mosquitto)
  # ================================================================
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: medical_display_mqtt
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # WebSocket
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    networks:
      - medical_display_network
    restart: unless-stopped

  # ================================================================
  # Redis Cache
  # ================================================================
  redis:
    image: redis:7-alpine
    container_name: medical_display_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - medical_display_network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # ================================================================
  # MongoDB (Optional - for large telemetry storage)
  # ================================================================
  mongodb:
    image: mongo:6
    container_name: medical_display_mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=changeme
    volumes:
      - mongo_data:/data/db
    networks:
      - medical_display_network
    restart: unless-stopped
    profiles:
      - with-mongodb

  # ================================================================
  # Nginx Reverse Proxy
  # ================================================================
  nginx:
    image: nginx:alpine
    container_name: medical_display_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - medical_display_network
    restart: unless-stopped
    profiles:
      - with-nginx

  # ================================================================
  # Prometheus Metrics (Optional)
  # ================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: medical_display_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - medical_display_network
    restart: unless-stopped
    profiles:
      - with-monitoring

  # ================================================================
  # Grafana Dashboard (Optional)
  # ================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: medical_display_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - medical_display_network
    restart: unless-stopped
    profiles:
      - with-monitoring

networks:
  medical_display_network:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_logs:
  redis_data:
  mongo_data:
  prometheus_data:
  grafana_data:
