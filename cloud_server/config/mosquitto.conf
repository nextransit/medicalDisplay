# Mosquitto Configuration for Medical Display System

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connection
max_connections -1
max_keepalive 65535

# MQTT Protocol
listener 1883
protocol mqtt

# WebSocket (for web clients)
listener 9001
protocol websockets

# Security
allow_anonymous true

# Message limits
message_size_limit 10485760  # 10MB
max_queued_messages 1000

# QoS settings
max_inflight_messages 20
max_queued_bytes 0
